<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}CourtCall{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <a class="brand" href="{{ url_for('dashboard') }}">CourtCall</a>
  <nav>
    <a href="{{ url_for('dashboard') }}">Sessions</a>
    <a href="{{ url_for('players') }}">Players</a>
    <a href="{{ url_for('upload') }}">Upload</a>
    <a href="{{ url_for('compose') }}">Compose</a>
    <a href="{{ url_for('log') }}">Log</a>
  </nav>
</header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, text in messages %}<div class="flash {{ category }}">{{ text }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
